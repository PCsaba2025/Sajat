<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egyéb információ</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <style>
        .video-container {
            margin-bottom: 30px;
            text-align: center;
            display: block;
            width: 100%;
            clear: both;
        }
        
        .video-container video {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: block;
            margin: 0 auto;
        }
        
        .video-title {
            margin-bottom: 10px;
            color: #333;
            font-weight: bold;
            display: block;
        }
        
        .osszehasonlitas {
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="doboz-1">
            <h1>Egyéb információ!</h1>
            <p>Ezen az oldalon megtalál egyébb fontos információkat mind a két eszközzel!<br></p>
        </div>
    </div>

    
    <div class="oszlop-2">
        <h2><strong>Egyéb információk</strong></h2>
        <div class="oszlop-2">
      
        </div>
        <div class="iras-info">
            Kattints a fenti területre, majd kezdj el írni!
        </div>
    </div>

    <div class="osszehasonlitas">
        <!-- Első videó -->
        <div class="video-container">
            <h3 class="video-title">1. Videó</h3>
            <video controls width="600">
                <source src="videó1.mp4" type="video/mp4">
                A böngésződ nem támogatja a videó lejátszást.
            </video>
            <p>Első videó leírása</p>
        </div>
        
        <!-- Második videó -->
        <div class="video-container">
            <h3 class="video-title">2. Videó</h3>
            <video controls width="600">

                A böngésződ nem támogatja a videó lejátszást.
            </video>
            <p>Második videó leírása</p>
        </div>
        
        <!-- Harmadik videó -->
        <div class="video-container">
            <h3 class="video-title">3. Videó</h3>
            <video controls width="600">
                <source src="videó3.mp4" type="video/mp4">
                A böngésződ nem támogatja a videó lejátszást.
            </video>
            <p>Harmadik videó leírása</p>

    </div>
