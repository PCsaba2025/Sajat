<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGIPWG - Űrlap</title>

    <style>
        html, body {
            font-family: arial, sans-serif;
            font-size: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font: normal 16px;
            line-height: 1.6em;
            margin: 0;
            text-align: center;
        }

        .doboz-1 {
            background-image: url(kepek/images.png);
            color: white;
            border: 3px red solid;
            padding: 25px;
            margin-top: 0px;
            margin-bottom: 20px;
            text-align: center;
        }

        .doboz-1 h1 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            text-decoration: underline;
            text-transform: uppercase;
        }

        section {
            background-color: #2d2d2d;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid #404040;
            max-width: 800px;
            margin: 20px auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        header {
            width: 100%;
            padding: 1rem;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin: 20px 0;
        }

        footer {
            margin-top: 2rem;
            border-top: 1px solid #404040;
            padding: 1rem;
            text-align: right;
            font-size: 0.8rem;
            color: #999;
        }

        label {
            display: block;
            width: 100%;
            text-align: left;
            margin-bottom: 20px;
            color: #e0e0e0;
        }

        input[type="text"],
        input[type="password"],
        input[type="range"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #404040;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        .sidebyside {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .sidebyside input[type="submit"] {
            color: white;
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 15px 25px;
            border: 1px solid #404040;
            cursor: pointer;
        }

        .sidebyside input[type="submit"]:hover {
            border-color: teal;
        }

        a {
            text-decoration: none;
            color: teal;
        }

        a:hover {
            color: red;
        }

        a:active {
            color: black;
        }
    </style>

</head>

<body>
    
    <div class="doboz-1">
        <h1>Értékelés</h1>
    </div>

    <section>
        <form action="DGIPWG_feldolgozo.php" target="_self" method="post"
        name="urlap" id="urlap">

            <label for="nev">
                Név:
                <input type="text" id="nev" name="nev" required pattern="([A-ZÁÉÍÓÖŐÚÖŰ a-záéíöőüú]){4,}" title="Írd be a neved"
                placeholder="Írd be a neved" autofocus autocomplete="off">
            </label>

            <label for="pin">
                PIN kód:
                <input type="password" id="pin" name="pin" required pattern="[0-9]{4}" title="4 számjegyű pinkód" placeholder="Írd be a PIN kódot">
            </label>

            <label for="fav_termek">
                Kedvenc termék:
                <input list="termek" id="fav_termek" name="fav_termek" placeholder="Válassz a listából" title="Laptop, Számítögép">
                <datalist id="termek">
                    <option value="Laptop">Laptop</option>
                    <option value="Számítógép">Számítógép</option>
                </datalist>
            </label>

            <label for="confidence">
                Mennyire volt hasznos az oldal?:
                <input type="range" id="confidence" name="confidence" min="0" max="100" step="0.1" title="0 és 100 közötti érték">
            </label>
        </form>
        <br>

        <div class="sidebyside">
            <input type="submit" value="Elküld" form="urlap">
            <input type="submit" value="Elküld ellenőrzés nélkűl" formnovalidate form="urlap">
        </div>
    </section>

    <footer>
        DGIPWG - Vélemény űrlap
    </footer>
    
</body>
</html>
